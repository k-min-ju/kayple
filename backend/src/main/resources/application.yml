spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/app?serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  address: 127.0.0.1
  port: 8080
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:}
