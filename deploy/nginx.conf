server {
    listen 80;
    listen [::]:80;
    server_name kmj.recruit.kayple.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kmj.recruit.kayple.com;

    ssl_certificate     /etc/letsencrypt/live/kmj.recruit.kayple.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kmj.recruit.kayple.com/privkey.pem;

    root /var/www/kayple;
    index index.html;

    # SPA: /admin, /my 새로고침 시에도 index.html
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
